name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vibe
          POSTGRES_PASSWORD: vibe
          POSTGRES_DB: vibe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      DATABASE_URL: postgres://vibe:vibe@localhost:5432/vibe
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-value-please-change
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: node scripts/secret-scan.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npm run migrate

      - name: Test
        run: npm test

      - name: Build web client
        # The job-level NODE_ENV=test is for the API test run. Vite reads
        # NODE_ENV at build time and emits the dev React build under anything
        # but "production", which doubles the bundle. Force it here.
        env:
          NODE_ENV: production
        run: npm run build

      - name: Enforce bundle budget
        run: node scripts/check-bundle.mjs

      - name: Start API and web for end-to-end
        # The e2e walkthrough drives the real UI against a running stack.
        env:
          NODE_ENV: development
        run: |
          npm run dev:api > /tmp/api.log 2>&1 &
          npm run dev:web > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:12000/v1/health >/dev/null && curl -sf http://localhost:12001 >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:12000/v1/health >/dev/null || { cat /tmp/api.log; exit 1; }

      - name: Seed demo data
        run: |
          python3 scripts/seed-demo.py
          python3 scripts/seed-demo-2.py

      - name: Install Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Run end-to-end suite
        env:
          WEB_URL: http://localhost:12001/
          CHROME_BIN: chromium-browser
        run: |
          if ! command -v chromium-browser >/dev/null; then export CHROME_BIN=chromium; fi
          node e2e.mjs

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: .audit/*.png
          if-no-files-found: ignore
