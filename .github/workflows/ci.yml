name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vibe
          POSTGRES_PASSWORD: vibe
          POSTGRES_DB: vibe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      DATABASE_URL: postgres://vibe:vibe@localhost:5432/vibe
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-value-please-change
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npm run migrate

      - name: Test
        run: npm test

      - name: Build web client
        # The job-level NODE_ENV=test is for the API test run. Vite reads
        # NODE_ENV at build time and emits the dev React build under anything
        # but "production", which doubles the bundle. Force it here.
        env:
          NODE_ENV: production
        run: npm run build

      - name: Enforce bundle budget
        run: node scripts/check-bundle.mjs
